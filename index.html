<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Warung</title>
    <!-- Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- App Bar (Header) -->
    <header class="app-bar">
        <div class="logo">WarungApp <span>v0.1.0</span></div>
        <div class="cart-icon" onclick="showPage('cart-page')">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-container">
        
        <!-- Halaman Utama (Katalog) -->
        <section id="home-page" class="page active">
            <!-- Space Iklan / Promo -->
            <div class="promo-banner">
                <img src="https://via.placeholder.com/800x300?text=Promo+Spesial+Hari+Ini" alt="Promo">
            </div>
            
            <div class="section-title">Katalog Produk</div>
            <div class="product-grid" id="product-list">
                <!-- Produk akan diload di sini oleh JS -->
                <div class="loading">Memuat produk dari database...</div>
            </div>
        </section>

        <!-- Halaman Detail Produk -->
        <section id="detail-page" class="page">
            <button class="btn-back" onclick="showPage('home-page')">← Kembali</button>
            <div id="detail-content">
                <!-- Detail produk akan diload di sini -->
            </div>
        </section>

        <!-- Halaman Keranjang -->
        <section id="cart-page" class="page">
            <button class="btn-back" onclick="showPage('home-page')">← Kembali</button>
            <h2 class="section-title">Keranjang Belanja</h2>
            <div id="cart-list">
                <!-- Item keranjang di sini -->
            </div>
            <div class="cart-summary">
                <div class="total">Total: <span id="cart-total">Rp 0</span></div>
                <button class="btn-checkout" onclick="checkoutWA()">Checkout via WhatsApp</button>
            </div>
        </section>

        <!-- Halaman Admin (Hidden by default) -->
        <section id="admin-page" class="page">
            <button class="btn-back" onclick="showPage('home-page')">← Kembali</button>
            <h2 class="section-title">Dashboard Admin</h2>
            <p class="text-muted">Kelola produk via Google Sheet atau form di bawah (Segera Hadir di v0.2.0)</p>
            <div class="admin-panel">
                <button class="btn-primary" onclick="window.open('URL_GOOGLE_SHEET_ANDA', '_blank')">Buka Google Sheet</button>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation (Android Style) -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showPage('home-page')">🏠 Beranda</div>
        <div class="nav-item" onclick="showPage('cart-page')">🛒 Keranjang</div>
        <div class="nav-item" onclick="showPage('admin-page')">⚙️ Admin</div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
